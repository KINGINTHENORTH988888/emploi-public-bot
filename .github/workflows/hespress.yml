name: Bot Hespress Veille

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hespress:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le bot Hespress
        env:
          HESPRESS_TELEGRAM_TOKEN: ${{ secrets.HESPRESS_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hespress_bot.py

      - name: Sauvegarder l'historique Hespress
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch historique_hespress.txt
          git add historique_hespress.txt
          git diff-index --quiet HEAD || git commit -m "Mise à jour historique Hespress"
          git push
